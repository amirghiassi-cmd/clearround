<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Visit ClearRound for the latest app information." />
  <title>Return to ClearRound</title>
  <link rel="stylesheet" href="../../styles.css" />
  <style>
    .legacy-wrap{min-height:100vh;display:grid;place-items:center;padding:32px 20px;background:#f4f7fb}
    .legacy-card{width:min(620px,100%);background:#fff;border-radius:28px;padding:clamp(28px,6vw,56px);box-shadow:0 16px 45px rgba(17,46,83,.12);text-align:center}
    .legacy-logo{width:84px;height:84px;border-radius:20px;margin-bottom:24px}
    .legacy-card h1{margin:0 0 16px;color:#112e53;font-size:clamp(2rem,7vw,3.4rem);line-height:1.05}
    .legacy-card p{margin:0 auto 16px;max-width:500px;color:#4c5663;line-height:1.7}
    .status-mark{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 22px;border-radius:50%;background:#e8f7ef;color:#0f7a4c;font-size:28px;font-weight:800}
    .legacy-note{margin-top:24px!important;padding:16px 18px;border-radius:14px;background:#f3f6f9;color:#34465d!important;font-size:.95rem}
    .home-link{display:inline-block;margin-top:14px;color:#0f5d3a;font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <main class="legacy-wrap">
    <section class="legacy-card" aria-labelledby="page-title">
      <img class="legacy-logo" src="../../clearround-logo.png" alt="ClearRound" />
      <div class="status-mark" aria-hidden="true">i</div>
      <h1 id="page-title">Return to ClearRound</h1>
      <p>This setup page is no longer used. Visit the ClearRound website for the latest app features, including the quote calculator.</p>
      <p class="legacy-note">You can close this page and return to ClearRound.</p>
      <a class="home-link" href="../../index.html">Visit the ClearRound website</a>
    </section>
  </main>
</body>
</html>
